<html>
<head>
  <meta charset="UTF-8">
  <title>Elite - إنشاء حساب</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>مؤسسة Elite التعليمية</h1>
  </header>
  <nav>
    <a href="index-ar.html">الرئيسية</a>
    <a href="login-ar.html">تسجيل الدخول</a>
    <a href="register-ar.html">إنشاء حساب</a>
  </nav>
  <center>
    <div>
      <h1>إنشاء حساب جديد</h1>
      <form method="post" action="home.html">
        <input type="text" placeholder="الاسم الكامل" required>
        <input type="email" placeholder="البريد الإلكتروني" required>
        <input type="password" placeholder="كلمة المرور" required>
        <input type="password" placeholder="تأكيد كلمة المرور" required>
        <button type="submit">تسجيل</button>
      </form>
      <p style="margin-top:20px;">
        لديك حساب مسبقاً؟ <a href="login.html" style="color:Deepblue;">سجل دخولك هنا</a>
      </p>
    </div>
  </center>
  <script>
    let h = new Date().getHours();
    if (h >= 18 || h < 6)document.body.classList.add("dark");
  </script>
</body>
</html>
