<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Elite - البرامج الحسابية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>مؤسسة Elite التعليمية</h1>
    <p>
      نرتقي بالتعليم نحو التميز
    </p>
  </header>

  <nav>
    <a href="index.html">الرئيسية</a>
    <a href="portfolio.html">أعمالنا</a>
    <a href="tools.html">البرامج الحسابية</a>
    <a href="contact.html">تواصل معنا</a>
  </nav>

  <div class="container">
    <div class="card">
      <h2>البرامج الحسابية التفاعلية</h2>

      <!-- حساب حجم الاسطوانة -->
      <div class="tool">
        <h3>حساب حجم الاسطوانة</h3>
        <input type="number" id="r1" placeholder="نصف القطر">
        <input type="number" id="h1" placeholder="الارتفاع">
        <button onclick="calcCylinder()">احسب</button>
        <div class="result" id="res1"></div>
      </div>

      <!-- حساب مساحة الدائرة -->
      <div class="tool">
        <h3>حساب مساحة الدائرة</h3>
        <input type="number" id="r2" placeholder="نصف القطر">
        <button onclick="calcCircle()">احسب</button>
        <div class="result" id="res2"></div>
      </div>

      <!-- حل معادلة الدرجة الثانية -->
      <div class="tool">
        <h3>حل معادلة الدرجة الثانية ax² + bx + c = 0</h3>
        <input type="number" id="a" placeholder="a">
        <input type="number" id="b" placeholder="b">
        <input type="number" id="c" placeholder="c">
        <button onclick="solveQuadratic()">حل</button>
        <div class="result" id="res3"></div>
      </div>
    </div>
  </div>

  <script>
    function calcCylinder() {
      let r = parseFloat(document.getElementById('r1').value);
      let h = parseFloat(document.getElementById('h1').value);
      if (r && h) {
        let v = Math.PI * r * r * h;
        document.getElementById('res1').innerText = `الحجم = ${v.toFixed(2)}`;
      }
    }

    function calcCircle() {
      let r = parseFloat(document.getElementById('r2').value);
      if (r) {
        let a = Math.PI * r * r;
        document.getElementById('res2').innerText = `المساحة = ${a.toFixed(2)}`;
      }
    }

    function solveQuadratic() {
      let a = parseFloat(document.getElementById('a').value);
      let b = parseFloat(document.getElementById('b').value);
      let c = parseFloat(document.getElementById('c').value);
      let d = b*b - 4*a*c;

      if (d > 0) {
        let x1 = (-b + Math.sqrt(d)) / (2*a);
        let x2 = (-b - Math.sqrt(d)) / (2*a);
        document.getElementById('res3').innerText = `x1 = ${x1.toFixed(2)}, x2 = ${x2.toFixed(2)}`;
      } else if (d === 0) {
        let x = -b / (2*a);
        document.getElementById('res3').innerText = `حل واحد: x = ${x.toFixed(2)}`;
      } else {
        document.getElementById('res3').innerText = 'لا يوجد حل حقي';
      }
    }
  </script>
</body>
</html>
